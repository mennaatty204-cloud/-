                const total = mine.reduce((a, n) => a + Math.floor(n.count), 0)
                    + troops.filter(t => t.team === PLAYER_TEAM && !t.dead).reduce((a, t) => a + KIND[t.kind].cost, 0)
                    + launches.filter(l => l.team === PLAYER_TEAM).reduce((a, l) => a + l.remaining * KIND[l.kind].cost, 0);
                const lvl = Math.max(peakLevel, ...mine.map(n => n.level), 1);
                carryData = { count: total, level: lvl };
                if (mine.filter(n => n.level >= MAX_LEVEL).length >= 4) carryData.nodes = [{ l: MAX_LEVEL, c: 100 }, { l: MAX_LEVEL, c: 50 }];
                pendingCarry = carryData;
                granted = grantPowerups();
            } else {
                carryData = levelCarry;
                pendingCarry = null;
            }
            // الهزيمة تعيد المهارات التي كانت معك عند بداية المرحلة
            const pwSave = won ? { ...powerups } : { ...levelStartPw };
            writeSave({ v: 1, level: won ? currentLevel + 1 : currentLevel, nodes: null, carry: carryData, pw: pwSave, pw0: pwSave, df: difficulty });

            if (won) {
                icon.className = 'w-16 h-16 md:w-20 md:h-20 mx-auto rounded-3xl flex items-center justify-center text-3xl md:text-4xl shadow-xl bg-blue-500/20 text-blue-400 border border-blue-500/30';
                icon.innerHTML = '<svg class="ico" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M144.3 0h224c26.5 0 48.1 21.8 47.1 48.2-.2 5.3-.4 10.6-.7 15.8h49.6c26.1 0 49.1 21.6 47.1 49.8-7.5 103.7-60.5 160.7-118 190.5-15.8 8.2-31.9 14.3-47.2 18.8-20.2 28.6-41.2 43.7-57.9 51.8V448h64c17.7 0 32 14.3 32 32s-14.3 32-32 32h-192c-17.7 0-32-14.3-32-32s14.3-32 32-32h64v-73.1c-16-7.7-35.9-22-55.3-48.3-18.4-4.8-38.4-12.1-57.9-23.1C57 273.2 8.2 216.1 1.2 113.6c-1.9-28.1 21-49.7 47.1-49.7h49.6c-.3-5.2-.5-10.4-.7-15.8-1-26.5 20.6-48.2 47.1-48.2zm-42.8 112H49.1c6.2 84.7 45.1 127.1 85.2 149.6-14.4-37.3-26.3-86-32.8-149.6M380 256.8c40.5-23.8 77.1-66.1 83.3-144.8H411c-6.2 60.9-17.4 108.2-31 144.8"/></svg>';
                title.innerText = `فزت بالمستوى ${currentLevel}!`;
                sub.innerText = `جيشك (${carryData.count} جندي، ترقية ${carryData.level}) ${carryData.nodes ? 'سينتقل معك في مقاطعتين مكتملتي الترقية (واحدة ممتلئة ونصف الأخرى)' : 'سينتقل معك في مقاطعة واحدة'}` +
                    (granted ? ` — مكافأة: ${granted}` : '') + '...';
                modalBtn.innerText = 'الانتقال الفوري للمستوى التالي';
                modalBtn.dataset.won = '1';

                setTimeout(() => {
                    if (isGameOver && token === gameToken) {
                        initGame(currentLevel + 1);
                    }
                }, 1500);
            } else {
                icon.className = 'w-16 h-16 md:w-20 md:h-20 mx-auto rounded-3xl flex items-center justify-center text-3xl md:text-4xl shadow-xl bg-red-500/20 text-red-400 border border-red-500/30';
                icon.innerHTML = '<svg class="ico" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M416 427.4c58.5-44 96-111.6 96-187.4C512 107.5 397.4 0 256 0S0 107.5 0 240c0 75.8 37.5 143.4 96 187.4V464c0 26.5 21.5 48 48 48h32v-40c0-13.3 10.7-24 24-24s24 10.7 24 24v40h64v-40c0-13.3 10.7-24 24-24s24 10.7 24 24v40h32c26.5 0 48-21.5 48-48zM96 256a64 64 0 1 1 128 0 64 64 0 1 1-128 0m256-64a64 64 0 1 1 0 128 64 64 0 1 1 0-128"/></svg>';
                title.innerText = 'هزيمة!';
                sub.innerHTML = (reason ? reason + '<br>' : '') + `أعلى سكور: ${best.score}<br>أعلى مستوى: ${best.level}`;
                modalBtn.innerText = 'اللعب مرة أخرى من المستوى 1';
                modalBtn.dataset.won = '0';
            }

            modal.classList.remove('hidden');
        }

        function gameLoop(ts) {
            if (ts === undefined) ts = performance.now();
            let dt = lastFrameTs ? ts - lastFrameTs : 16.667;
            lastFrameTs = ts;
            if (dt > 50) dt = 50;   // لا قفزات كبيرة بعد تأخر الفريمات
            if (dt < 0) dt = 0;
            const run = !paused;
            const k = run ? dt / 16.667 : 0; // 1 = فريم واحد على شاشة 60Hz
            if (run) gameTime += dt;
            const frozen = gameTime < freezeUntil;

            ctx.fillStyle = '#0b1220';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (mapDirty) {
                renderMap();
                mapDirty = false;
            }
            ctx.imageSmoothingEnabled = true;
            ctx.drawImage(mapCanvas, 0, 0, W, H);
            drawLakes();

            if (selectedNodes.length > 0) {
                ctx.strokeStyle = 'rgba(255,255,255,0.85)';
                ctx.lineWidth = 3;
                ctx.setLineDash([8, 6]);

                for (let i = 0; i < selectedNodes.length - 1; i++) {
                    ctx.beginPath();
                    ctx.moveTo(selectedNodes[i].x, selectedNodes[i].y);
                    ctx.lineTo(selectedNodes[i + 1].x, selectedNodes[i + 1].y);
                    ctx.stroke();
                }

                const lastSelected = selectedNodes[selectedNodes.length - 1];
                ctx.beginPath();
                ctx.moveTo(lastSelected.x, lastSelected.y);
                ctx.lineTo(pointer.x, pointer.y);
                ctx.stroke();

                ctx.setLineDash([]);
            }

            if (run) {
                if (!isGameOver) {
                    // النمو والذكاء والإرسال كلها على ساعة اللعبة فتتوقف مع الإيقاف
                    growAcc += dt;
                    while (growAcc >= 1000) {
                        growAcc -= 1000;
                        nodes.forEach(node => node.grow());
                    }
                    runAI();
                    updateLaunches(dt);
                }
                updateCannons(gameTime);
                shells.forEach(s => s.update(k));
                shells = shells.filter(s => !s.dead);
                troops = troops.filter(t => !t.dead);

                troops.forEach(troop => {
                    if (frozen && troop.team !== PLAYER_TEAM) return; // جنود الأعداء متجمدون
                    troop.update(k);
                });
                troops = troops.filter(t => !t.reached);

                // الجنود البريون الذين يدخلون البحيرة يغرقون (السفن من الموانئ تعبرها)
                if (lakes.length) {
                    for (const t of troops) {
                        if (!t.dead && !t.ship && inLake(t.x, t.y)) {
                            t.dead = true;
                            fx.push({ kind: 'ring', x: t.x, y: t.y, color: '#38bdf8', life: 1 });
                        }
                    }
                    troops = troops.filter(t => !t.dead);
                }

                checkTroopCollisions();
            }

            computeThreats();
            computeVisible();

            troops.forEach(troop => troop.draw());
            nodes.forEach(node => node.draw());
            shells.forEach(s => s.draw());
            updateAndDrawFx(k);

            // طبقات الحالة: تجميد، نمو مضاعف، وضع الصاروخ
            if (frozen) {
                ctx.fillStyle = 'rgba(125,211,252,0.10)';
                ctx.fillRect(0, 0, W, H);
            }
            let hy = 14;
            ctx.font = 'bold 12px Cairo, Tahoma, "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            if (frozen) {
                ctx.fillStyle = '#7dd3fc';
                ctx.fillText('تجميد الأعداء ' + ((freezeUntil - gameTime) / 1000).toFixed(1) + ' ث', 8, hy);
                hy += 16;
            }
            if (gameTime < boostUntil) {
                ctx.fillStyle = '#86efac';
                ctx.fillText('نمو ×2 ' + ((boostUntil - gameTime) / 1000).toFixed(1) + ' ث', 8, hy);
            }
            if (missileMode) {
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 3;
                ctx.setLineDash([10, 8]);
                ctx.strokeRect(3, 3, W - 6, H - 6);
                ctx.setLineDash([]);
            }

            uiAcc += dt;
            if (uiAcc >= 200) { // 5 مرات في الثانية بدل كل فريم
                uiAcc = 0;
                if (sticky.length) {
                    const before = sticky.length;
                    sticky = sticky.filter(n => n.team === PLAYER_TEAM);
                    if (sticky.length !== before) updateToolbarUI();
                }
                checkGameState();
            }
            requestAnimationFrame(gameLoop);
        }

        document.getElementById('restartBtn').addEventListener('click', () => {
            if (currentLevel > 1 && !confirm('سيتم البدء من المستوى 1 واستبدال الحفظ الحالي. متابعة؟')) return;
            startNewGame();
        });
        document.getElementById('modalRestartBtn').addEventListener('click', () => {
            const won = document.getElementById('modalRestartBtn').dataset.won === '1';
            if (won) initGame(currentLevel + 1); else startNewGame();
        });

        // ===== المؤثرات الصوتية =====
        let audioCtx = null, lastRepel = 0;
        function getAudio() {
            try {
                if (!audioCtx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return null;
                    audioCtx = new AC();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return audioCtx;
            } catch (e) { return null; }
        }
        function tone(freq, start, dur, type, vol) {
            const a = getAudio();
            if (!a) return;
            const t = a.currentTime + start;
            const o = a.createOscillator(), g = a.createGain();
            o.type = type;
            o.frequency.setValueAtTime(freq, t);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g); g.connect(a.destination);
            o.start(t); o.stop(t + dur + 0.05);
        }
        function playSfx(kind) {
            if (kind === 'win') {
                [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.35, 'triangle', 0.18));
                tone(1318, 0.52, 0.6, 'triangle', 0.16);
            } else if (kind === 'lose') {
                [392, 349, 311, 262].forEach((f, i) => tone(f, i * 0.25, 0.45, 'sawtooth', 0.09));
            } else if (kind === 'repel') {
                const now = performance.now();
                if (now - lastRepel < 350) return;
                lastRepel = now;
                tone(180, 0, 0.12, 'square', 0.08);
                tone(320, 0.06, 0.15, 'triangle', 0.1);
            }
        }
        document.addEventListener('pointerdown', getAudio);

        // ===== أعلى نتيجة ومستوى =====
        const BEST_KEY = 'stateio_best_v1';
        let best = { score: 0, level: 1 };
        try {
            const b = JSON.parse(localStorage.getItem(BEST_KEY));
            if (b) { best.score = b.score | 0; best.level = (b.level | 0) || 1; }
        } catch (e) {}
        function saveBest() { try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch (e) {} }

        // ===== الحفظ والتحميل (localStorage) =====
        const SAVE_KEY = 'stateio_straight_save_v1';

        function readSave() {
            try {
                const raw = localStorage.getItem(SAVE_KEY);
                if (!raw) return null;
                const d = JSON.parse(raw);
                if (!d || d.v !== 1 || !(d.level >= 1)) return null;
                return d;
            } catch (e) { return null; }
        }

        function writeSave(d) {
            try {
                d.ts = Date.now(); saveBest();
                localStorage.setItem(SAVE_KEY, JSON.stringify(d));
                return true;
            } catch (e) { return false; }
        }

        function buildSave() {
            return {
                v: 1,
                df: difficulty,
                level: currentLevel,
                carry: levelCarry,
                peak: peakLevel,
                nodes: nodes.map(n => ({
                    nx: n.nx, ny: n.ny, t: n.team.id,
                    c: Math.round(n.count * 100) / 100,
                    l: n.level, k: n.isCannon ? 1 : 0, f: n.isFortress ? 1 : 0,
                    a: Math.round(n.aimAngle * 1000) / 1000,
                    kd: n.kind || 0, g: n.isTarget ? 1 : 0
                })),
                troops: troops.filter(t => !t.dead && !t.reached).map(t => ({
                    f: t.path[0].id, to: t.path[1].id,
                    nx: t.x / W, ny: t.y / H, t: t.team.id,
                    k: t.kind, h: Math.round(t.hp * 100) / 100, s: t.ship ? 1 : 0
                })),
                // الجنود الذين لم يخرجوا بعد من المقاطعة (كانوا يضيعون عند الحفظ سابقاً)
                launches: launches.filter(l => l.remaining > 0).map(l => ({
                    f: l.from.id, to: l.to.id, t: l.team.id, r: l.remaining, k: l.kind
                })),
                ai: Object.fromEntries(Object.entries(aiProfiles).map(([id, pr]) => [id, pr.type])),
                lakes: lakes,
                obj: { k: objective.type, left: objective.endAt != null ? Math.max(0, Math.round(objective.endAt - gameTime)) : null },
                pw: { ...powerups },
                pw0: { ...levelStartPw }
            };
        }

        function saveGame() {
            if (isGameOver || !nodes.length) return false;
            return writeSave(buildSave());
        }

        function teamById(id) {
            if (id === PLAYER_TEAM.id) return PLAYER_TEAM;
            if (id === NEUTRAL_TEAM.id) return NEUTRAL_TEAM;
            if (id === BOSS_TEAM.id) return BOSS_TEAM;
            return ENEMY_PALETTE.find(e => e.id === id) || null;
        }

        function applySave(d) {
            pendingCarry = d.carry || null;
            setDifficulty(d.df);
            initGame(d.level, true);
            if (d.pw) powerups = { freeze: 0, boost: 0, missile: 0, ...d.pw };
            levelStartPw = d.pw0 ? { freeze: 0, boost: 0, missile: 0, ...d.pw0 } : { ...powerups };
            updatePowerUI();
            if (d.nodes && d.nodes.length) {
                const restored = [];
                for (let i = 0; i < d.nodes.length; i++) {
                    const o = d.nodes[i];
                    const team = teamById(o.t);
                    if (!team) { saveGame(); return; } // حفظ تالف: نبدأ المستوى من جديد
                    const n = new Node(i, o.nx, o.ny, team, o.c);
                    n.level = o.l || 1;
                    n.isCannon = !!o.k;
                    n.isFortress = !!o.f;
                    n.kind = o.kd || null;
                    n.isTarget = !!o.g;
                    if (typeof o.a === 'number') n.aimAngle = o.a;
                    restored.push(n);
                }
                nodes = restored;
                troops = [];
                (d.troops || []).forEach(o => {
                    const a = nodes[o.f], b = nodes[o.to], team = teamById(o.t);
                    if (!a || !b || !team) return;
                    const t = new Troop([a, b], team, o.k, !!o.s);
                    if (typeof o.h === 'number') t.hp = o.h;
                    t.x = o.nx * W;
                    t.y = o.ny * H;
                    troops.push(t);
                });
                launches = [];
                (d.launches || []).forEach(o => {
                    const a = nodes[o.f], b = nodes[o.to], team = teamById(o.t);
                    if (!a || !b || !team || !(o.r > 0)) return;
                    launches.push({ from: a, to: b, team, remaining: Math.floor(o.r), kind: KIND[o.k] ? o.k : 'normal', ship: a.kind === 'port', acc: 0 });
                });
                if (d.ai) {
                    activeEnemies.forEach(e => {
                        if (aiProfiles[e.id] && AI_TYPES[d.ai[e.id]]) aiProfiles[e.id].type = d.ai[e.id];
                    });
                }
                lakes = Array.isArray(d.lakes) ? d.lakes : [];
                if (d.obj && d.obj.k) {
                    objective = { type: d.obj.k };
                    if (d.obj.left != null) objective.endAt = d.obj.left; // الساعة تبدأ من 0 بعد التحميل
                } else {
                    objective = { type: 'conquer' }; // حفظ قديم بلا هدف
                }
                buildMap();
                updateObjectiveUI();
                peakLevel = Math.max(peakLevel, d.peak || 1,
                    ...nodes.filter(n => n.team === PLAYER_TEAM).map(n => n.level));
            }
            saveGame();
        }

        let toastTimer = 0;
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.innerText = msg;
            el.style.opacity = '1';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1600);
        }

        document.getElementById('saveBtn').addEventListener('click', () => {
            if (isGameOver) { showToast('تقدمك محفوظ بالفعل'); return; }
            showToast(saveGame() ? 'تم حفظ اللعبة ✓' : 'تعذّر الحفظ (التخزين غير متاح)');
        });

        // حفظ تلقائي دوري + عند إخفاء الصفحة أو إغلاقها
        setInterval(saveGame, 5000);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                saveGame();
                if (!isGameOver) setPaused(true); // إيقاف تلقائي عند مغادرة التبويب
            }
        });
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('resumeBtn').addEventListener('click', () => setPaused(false));
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') togglePause();
        });
        window.addEventListener('pagehide', saveGame);

        // اختيار الصعوبة قبل أي بداية من المستوى 1
        let diffWasPaused = false;
        function startNewGame() {
            const modal = document.getElementById('diffModal');
            const cancel = document.getElementById('diffCancelBtn');
            const inGame = !isGameOver && nodes.length > 0;
            diffWasPaused = paused;
            if (inGame) setPaused(true);
            cancel.classList.toggle('hidden', !inGame);
            modal.classList.remove('hidden');
            modal.querySelectorAll('.diffBtn').forEach(b => {
                b.style.outline = b.dataset.d === difficulty ? '3px solid #fff' : 'none';
                b.onclick = () => {
                    modal.classList.add('hidden');
                    setDifficulty(b.dataset.d);
                    initGame(1);
                };
            });
            cancel.onclick = () => {
                modal.classList.add('hidden');
                if (!diffWasPaused) setPaused(false);
            };
        }

        function showStartChoice(d) {
            const modal = document.getElementById('startModal');
            let when = '';
            try { when = new Date(d.ts).toLocaleString('ar-EG'); } catch (e) {}
            document.getElementById('startSub').innerText =
                `المستوى ${d.level}` + (d.nodes ? ' (مع حالة الخريطة)' : '') + (when ? ` — آخر حفظ: ${when}` : '');
            modal.classList.remove('hidden');

            document.getElementById('continueBtn').onclick = () => {
                modal.classList.add('hidden');
                applySave(d);
            };
            document.getElementById('newGameBtn').onclick = () => {
                modal.classList.add('hidden');
                startNewGame();
            };
        }

        function setRatio(r, persist = true) {
            sendRatio = r;
            document.querySelectorAll('.ratioBtn').forEach(b => {
                const on = parseFloat(b.dataset.r) === r;
                b.classList.toggle('bg-blue-600', on);
                b.classList.toggle('text-white', on);
                b.classList.toggle('text-slate-300', !on);
            });
            if (persist) { try { localStorage.setItem('stateio_ratio', String(r)); } catch (e) {} }
        }
        document.querySelectorAll('.ratioBtn').forEach(b =>
            b.addEventListener('click', () => setRatio(parseFloat(b.dataset.r))));
        let savedRatio = 1;
        try {
            const v = parseFloat(localStorage.getItem('stateio_ratio'));
            if ([0.25, 0.5, 1].includes(v)) savedRatio = v;
        } catch (e) {}
        setRatio(savedRatio, false);

        // نوع الجنود
        function setKind(kd, persist = true) {
            sendKind = (kd === 'prod' || kd === 'fast' || kd === 'heavy') ? kd : 'prod';
            document.querySelectorAll('.kindBtn').forEach(b => {
                const on = b.dataset.k === sendKind;
                b.classList.toggle('bg-blue-600', on);
                b.classList.toggle('text-white', on);
                b.classList.toggle('text-slate-300', !on);
            });
            if (persist) { try { localStorage.setItem('stateio_kind', sendKind); } catch (e) {} }
        }
        document.querySelectorAll('.kindBtn').forEach(b => b.addEventListener('click', () => { setKind(b.dataset.k); showToast(b.title); }));
        let savedKind = 'prod';
        try { const v = localStorage.getItem('stateio_kind'); if (['prod', 'fast', 'heavy'].includes(v)) savedKind = v; } catch (e) {}
        setKind(savedKind, false);

        document.getElementById('selectAllBtn').addEventListener('click', toggleSelectAll);
        document.querySelectorAll('.pwBtn').forEach(b => b.addEventListener('click', () => usePowerup(b.dataset.p)));

        resizeCanvas();
        gameLoop();
        const savedGame = readSave();
        if (savedGame) showStartChoice(savedGame);
        else startNewGame();
    </script>
</body>
</html>
